<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert — preview</title></head>
<body>
<div id="root" class="rd-col"></div>
<script>
  var R = window.Reviewdat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(R.Alert, { tone: 'info', title: 'New review request' }, 'Ahmed asked for your feedback on the onboarding flow.'),
    h(R.Alert, { tone: 'success', title: 'Review submitted' }, 'Thanks, the team will see it right away.'),
    h(R.Alert, { tone: 'warning', title: 'Due tomorrow' }, '2 reviews are waiting for you.'),
    h(R.Alert, { tone: 'danger', title: 'Could not send' }, 'Check your connection and try again.')
  ));
</script>
</body>
</html>
