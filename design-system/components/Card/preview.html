<!-- @dsCard group="Content" height=200 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card — preview</title></head>
<body>
<div id="root" class="rd-col"></div>
<script>
  var R = window.Reviewdat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(R.Card, { title: 'Onboarding flow v2', meta: 'Shared by Ahmed · 2 hours ago', badge: h(R.Badge, { tone: 'warning' }, 'Pending') },
      h(R.Rating, { value: 4 }),
      h('div', { style: { display: 'flex', gap: 'var(--space-2)', marginTop: 'var(--space-2)' } },
        h(R.Button, { size: 'sm' }, 'Review now'), h(R.Button, { size: 'sm', variant: 'ghost' }, 'Later')))
  ));
</script>
</body>
</html>
