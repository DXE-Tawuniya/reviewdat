<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root" class="rd-row"></div>
<script>
  var R = window.Reviewdat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(R.Badge, null, 'Draft'),
    h(R.Badge, { tone: 'brand' }, 'New'),
    h(R.Badge, { tone: 'success' }, 'Approved'),
    h(R.Badge, { tone: 'warning' }, 'Pending'),
    h(R.Badge, { tone: 'danger' }, 'Rejected')
  ));
</script>
</body>
</html>
